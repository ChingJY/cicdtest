name: "使用自定義 Action 範例"

on:
  workflow_dispatch:
  push:
    branches: [ develop, release, master, github_action_cicd ]

jobs:
  greet:
    runs-on: macos-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: run Hello World Action
        id: hello
        uses: ./.github/actions/hello-world-action
        with:
          username: "Alice"

      - name: show greeting
        run: echo "greeting：${{ steps.hello.outputs.greeting }}!"
